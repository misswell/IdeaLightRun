name: Compile check

# GitHub 已于 2026-11-02 退役 macOS 14 runner（Xcode 15 / Swift 5.10 不再可用）；
# 这里改用仍受支持的 macOS 15。`swift test` 不会构建 App target，所以显式
# `swift build` 全量编译，打 tag 之前先在 main 上绿灯。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build every target with the release toolchain
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build all targets
        run: swift build
      - name: Build tests
        run: swift build --build-tests
