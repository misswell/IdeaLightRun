name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - run: swift --version

      # Maven 集成测试会真实下载依赖，CI 网络与耗时不可控，只在本地跑
      - name: Test
        run: swift test --skip MavenClasspathIntegrationTests

      - name: Build universal app
        run: APP_VERSION="${GITHUB_REF_NAME#v}" UNIVERSAL=1 ./scripts/build-app.sh release

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          ditto -c -k --keepParent build/IdeaLightRun.app "dist/IdeaLightRun-${VERSION}-universal.zip"
          (cd dist && shasum -a 256 *.zip > SHA256SUMS.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## 安装

          1. 下载 \`IdeaLightRun-${VERSION}-universal.zip\`，解压得到 IdeaLightRun.app
          2. 首次打开若被 Gatekeeper 拦截：右键 App → 打开 → 打开
             （产物为 ad-hoc 签名，未做 Apple 开发者公证）

          通用二进制（Apple Silicon + Intel），要求 macOS 13 及以上。
          需要本机安装 JDK 与 Maven（或项目内的 mvnw）。
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "IdeaLightRun ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            "dist/IdeaLightRun-${VERSION}-universal.zip" \
            "dist/SHA256SUMS.txt"
